<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Submit a product review on David Gomez's site. Provide ratings, features, and written feedback for products."
    />
    <meta name="author" content="David Gomez" />
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css" />
    <script src="scripts/form.js" defer></script>
  </head>
  <body>
    <header>
      <h1 id="course-title">Product Review Form</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="form.html">Submit Review</a>
        <a href="review.html">Reviews</a>
      </nav>
    </header>

    <main>
      <form id="reviewForm" method="get" action="review.html">
        <!-- Product Name -->
        <label for="product">Product Name *</label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>

        <!-- Overall Rating -->
        <fieldset>
          <legend>Overall Rating *</legend>
          <label
            ><input
              type="radio"
              name="rating"
              id="rating1"
              value="1"
              required
            />
            ☆</label
          >
          <label
            ><input type="radio" name="rating" id="rating2" value="2" />
            ☆☆</label
          >
          <label
            ><input type="radio" name="rating" id="rating3" value="3" />
            ☆☆☆</label
          >
          <label
            ><input type="radio" name="rating" id="rating4" value="4" />
            ☆☆☆☆</label
          >
          <label
            ><input type="radio" name="rating" id="rating5" value="5" />
            ☆☆☆☆☆</label
          >
        </fieldset>

        <!-- Date of Installation -->
        <label for="installDate">Date of Installation *</label>
        <input type="date" id="installDate" name="installDate" required />

        <!-- Useful Features -->
        <fieldset>
          <legend>Useful Features</legend>
          <label
            ><input type="checkbox" name="features" value="Ease of Use" /> Ease
            of Use</label
          >
          <label
            ><input type="checkbox" name="features" value="Design" />
            Design</label
          >
          <label
            ><input type="checkbox" name="features" value="Performance" />
            Performance</label
          >
          <label
            ><input type="checkbox" name="features" value="Support" />
            Support</label
          >
        </fieldset>

        <!-- Written Review -->
        <label for="review">Written Review</label>
        <textarea
          id="review"
          name="review"
          rows="5"
          placeholder="Write your review here..."
        ></textarea>

        <!-- User Name -->
        <label for="username">Your Name</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Optional"
        />

        <!-- Submit Button -->
        <input type="submit" value="Submit Review" />
      </form>
    </main>

    <footer>
      <p>
        &copy;<span id="currentyear"></span> David Gomez - Cartagena, Colombia
      </p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
